<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="folio">
  <!-- Full bleed, no corner rounding of our own. Android's maskable purpose and
       iOS's apple-touch-icon both apply their own mask, and a shape baked in
       here would show up clipped inside theirs. The artwork stays inside the
       central 80% circle those masks guarantee. -->
  <rect width="512" height="512" fill="#4a6fa5"/>
  <path d="M158 112h154l64 64v202a22 22 0 0 1-22 22H158a22 22 0 0 1-22-22V134a22 22 0 0 1 22-22z" fill="#fdfdfc"/>
  <path d="M312 112l64 64h-46a18 18 0 0 1-18-18z" fill="#c3d0e4"/>
  <g fill="#4a6fa5">
    <rect x="176" y="222" width="160" height="20" rx="10"/>
    <rect x="176" y="266" width="160" height="20" rx="10"/>
    <rect x="176" y="310" width="104" height="20" rx="10"/>
  </g>
</svg>
